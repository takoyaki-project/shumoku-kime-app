<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>種目決めアプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-title">
    <svg class="apple-icon" viewBox="0 0 64 64" role="img" aria-label="りんごのイラスト">
      <ellipse cx="44" cy="10" rx="8" ry="4" fill="#4caf50" transform="rotate(-30 44 10)"/>
      <path d="M32 20 C26 20 20 14 14 14 C8 14 4 20 4 28 C4 46 18 58 32 58 C46 58 60 46 60 28 C60 20 56 14 50 14 C44 14 38 20 32 20 Z" fill="#c0392b"/>
      <path d="M32 20 C30 14 34 8 40 6" fill="none" stroke="#8d6e63" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="20" cy="28" rx="6" ry="9" fill="#fff" opacity="0.3" transform="rotate(-20 20 28)"/>
      <circle cx="18" cy="40" r="3" fill="#ff9999" opacity="0.6"/>
      <circle cx="46" cy="40" r="3" fill="#ff9999" opacity="0.6"/>
      <circle cx="24" cy="34" r="2" fill="#2b2b28"/>
      <circle cx="40" cy="34" r="2" fill="#2b2b28"/>
      <path d="M26 42 Q32 47 38 42" fill="none" stroke="#2b2b28" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>種目決めアプリ</h1>
  </div>
  <p class="lead">町内会運動会の参加種目わりあてを自動化するツールです。データは一切外部に送信されず、このパソコンの中だけで処理されます。</p>
</header>

<main>
  <section id="step1" class="step">
    <h2>① 回答CSVを貼り付けて実行する</h2>
    <p>Googleフォームの回答をエクスポートしたCSVを、下の欄に貼り付けてください。名簿との突き合わせは行いません。</p>

    <label for="formInput">回答CSV（Googleフォームの回答）</label>
    <textarea id="formInput" rows="12" placeholder="ここに回答CSVの中身を貼り付け"></textarea>

    <div class="actions">
      <button id="runAssignBtn" class="primary">実行する</button>
      <button id="loadSampleBtn" class="secondary">サンプルデータで試す</button>
    </div>
    <p id="step1Status" class="status"></p>
  </section>

  <section id="resultSection" class="step hidden">
    <h2>② 結果を確認してダウンロード</h2>
    <div id="resultSummary"></div>
    <div class="actions">
      <button id="downloadBtn" class="primary">Excel（.xlsx）をダウンロード</button>
    </div>
    <p class="note">要確認の人がいる場合も、Excelには「（未割当）」として出力され、要確認列に理由が入ります。定員割れした種目には「欠員」という行が入ります。最終判断は人の目で確認してください。</p>
  </section>
</main>

<footer>
  <p class="muted">家族大運動会　子供会向けアプリ。困ったときは、手作業のやり方に戻ってもかまいません。</p>
</footer>

<script src="lib/papaparse.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="src/events-master.js"></script>
<script src="src/sample-data.js"></script>
<script src="src/core.js"></script>
<script src="src/app.js"></script>
</body>
</html>
